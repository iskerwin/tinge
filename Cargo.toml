[package]
name = "tinge"
version = "0.4.0"
edition = "2024"
description = "Highlight terminal output with regex rules, built in for network devices and Linux servers"
license = "MIT"
repository = "https://github.com/iskerwin/tinge"

[dependencies]
crossbeam-channel = "0.5.17"
libc = "0.2.191"
pcre2 = "0.2.11"
rayon = "1.12.0"
regex = "1.13.2"
signal-hook = "0.4.6"
thread_local = "1.1.10"
yaml-rust2 = "0.13.2"

[[bench]]
name = "corpus"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true
